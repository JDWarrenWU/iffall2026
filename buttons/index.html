<!DOCTYPE html>
<html>
	<head>

		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Jack - Buttons</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700,800" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css?family=Ubuntu:700" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css?family=Roboto:400,700,900" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css?family=Oswald:700" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Mea+Culpa&display=swap" rel="stylesheet">
		<link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
		<link rel="stylesheet" href="css/styles.css">

	</head>

	<body>

		<main>

			<h1>Button Styling — Jack Warren</h1>

			<div class="button_container">
				<a href="https://www.spotify.com" target="_blank" id="btn_spotify">Spotify</a>
			</div>

			<div class="button_container">
				<a href="https://www.amazon.com" target="_blank" id="btn_amazon">
					<i class="fa fa-amazon"></i>
				</a>
			</div>

			<div class="button_container">
				<a href="https://www.twitter.com" target="_blank" id="btn_twitter">twitter</a>
			</div>

			<div class="button_container">
				<a href="https://www.indiegogo.com" target="_blank" id="btn_indiegogo">
					<span>indiegogo</span>
				</a>
			</div>

			<div class="button_container">
				<a href="https://www.npr.org/" target="_blank" id="btn_npr">
					<span class="npr_box">N</span><span class="npr_box">P</span><span class="npr_box">R</span>
				</a>
			</div>

			<div class="button_container">
				<a href="https://www.pottermore.com/" target="_blank" id="btn_pottermore">
					Pottermore
				</a>
			</div>

			<div class="button_container">
				<a href="https://www.cartoonnetwork.com/" target="_blank" id="btn_cartoon">
					<span class="cartoon_black">C</span><span class="cartoon_white">N</span>
				</a>
			</div>

			<div class="button_container">
				<a href="https://www.coca-cola.com/" target="_blank" id="btn_cocacola">
					Coca-Cola
				</a>
			</div>

			<div class="button_container">
				<a href="https://www.lyft.com/" target="_blank" id="btn_lyft">
					lyft
				</a>
			</div>

		</main>

	</body>
</html>
